<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English 1 Study Guide - All Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .word-card:hover .word-korean { opacity: 1; }
        .word-korean { transition: opacity 0.3s ease; opacity: 0; }
        
        /* Modal Styles */
        #infographic-modal { 
            display: none; 
            opacity: 0;
            transition: opacity 0.3s ease; 
        }
        #infographic-modal.active { 
            display: flex; 
            opacity: 1; 
        }

        /* Lesson Card Hover */
        .lesson-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .lesson-card:hover { transform: translateY(-5px); border-color: #6366f1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-700 flex items-center gap-2">
                <i data-lucide="book-open" class="text-indigo-600"></i>
                High School English 1
            </h1>
            <nav class="flex gap-1 sm:gap-2 overflow-x-auto pb-2 sm:pb-0 items-center">
                <a href="../index.html" class="px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-600 hover:bg-slate-100 flex items-center gap-1">
                    <i data-lucide="home" size="16"></i>
                    Home
                </a>
                <div class="h-4 w-[1px] bg-slate-200 mx-1"></div>
                <button onclick="switchTab('home')" id="nav-home" class="nav-btn px-4 py-1.5 rounded-full text-sm font-bold transition-all bg-indigo-600 text-white shadow-md">Dashboard</button>
                
                <!-- Generic Lesson Sub-tabs (Hidden on Dashboard) -->
                <div id="lesson-tabs" class="hidden flex gap-1 sm:gap-2 ml-2 border-l pl-2 border-slate-200">
                    <button onclick="switchTab('vocabulary')" id="nav-vocabulary" class="nav-btn px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">Voca</button>
                    <button onclick="switchTab('grammar')" id="nav-grammar" class="nav-btn px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">Grammar</button>
                    <button onclick="switchTab('content')" id="nav-content" class="nav-btn px-3 py-1.5 rounded-full text-sm font-bold transition-all text-slate-600 hover:bg-slate-100">Content</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Section: Home (Dashboard) -->
        <div id="section-home" class="tab-content active animate-fade-in space-y-8">
            <div class="bg-gradient-to-br from-indigo-700 to-indigo-900 rounded-3xl p-10 text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-4xl font-extrabold mb-2 leading-tight">Study Dashboard</h2>
                    <p class="text-indigo-100 text-lg max-w-xl leading-relaxed">
                        학습할 레슨을 선택하세요. 각 레슨별로 핵심 어휘, 문법, 본문 내용이 준비되어 있습니다.
                    </p>
                </div>
                <div class="absolute right-[-40px] bottom-[-40px] opacity-10 hidden lg:block">
                    <i data-lucide="layout-dashboard" style="width: 250px; height: 250px;"></i>
                </div>
            </div>

            <!-- Lesson Grid (8 Items) -->
            <div id="lesson-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Section: Vocabulary -->
        <div id="section-vocabulary" class="tab-content animate-fade-in space-y-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="p-3 bg-indigo-100 rounded-2xl text-indigo-600">
                    <i data-lucide="languages" size="28"></i>
                </div>
                <div>
                    <h2 id="voca-title" class="text-2xl font-bold italic underline decoration-indigo-300">Vocabulary</h2>
                    <p class="text-slate-500">단어 위에 마우스를 올리거나 터치하여 뜻을 확인하세요.</p>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="vocabulary-grid">
                <!-- Word Cards generated via JS -->
            </div>
        </div>

        <!-- Section: Grammar -->
        <div id="section-grammar" class="tab-content animate-fade-in space-y-8">
            <div class="flex items-center gap-4 mb-2">
                <div class="p-3 bg-emerald-100 rounded-2xl text-emerald-600">
                    <i data-lucide="file-code-2" size="28"></i>
                </div>
                <div>
                    <h2 id="grammar-title" class="text-2xl font-bold">Target Grammar</h2>
                    <p class="text-slate-500">해당 레슨의 핵심 문법 구조</p>
                </div>
            </div>
            <div id="grammar-list" class="space-y-6">
                <!-- Grammar Points generated via JS -->
            </div>
        </div>

        <!-- Section: Content -->
        <div id="section-content" class="tab-content animate-fade-in space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-rose-100 rounded-2xl text-rose-600">
                        <i data-lucide="layout-list" size="28"></i>
                    </div>
                    <div>
                        <h2 id="content-title" class="text-2xl font-bold">Core Summary</h2>
                        <p class="text-slate-500">본문의 핵심 흐름 파악하기</p>
                    </div>
                </div>
                <button id="infographic-btn" onclick="openModal()" class="hidden items-center gap-2 px-5 py-2.5 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 transition-colors shadow-lg active:scale-95">
                    <i data-lucide="image" size="18"></i>
                    인포그래픽 보기
                </button>
            </div>
            <div id="content-list" class="space-y-4">
                <!-- Content Points generated via JS -->
            </div>
        </div>
    </main>

    <!-- Modal for Infographic -->
    <div id="infographic-modal" class="fixed inset-0 bg-black/80 z-[100] items-center justify-center p-4 backdrop-blur-sm overflow-y-auto" onclick="closeModal()">
        <div class="relative max-w-5xl w-full bg-white rounded-3xl overflow-hidden shadow-2xl animate-fade-in" onclick="event.stopPropagation()">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800 flex items-center gap-2 italic">
                    <i data-lucide="image" class="text-indigo-600"></i>
                    Infographic
                </h3>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-200 rounded-full transition-colors">
                    <i data-lucide="x" size="24" class="text-slate-500"></i>
                </button>
            </div>
            <div class="p-2 sm:p-6 flex justify-center bg-slate-100 min-h-[300px] items-center">
                <img id="modal-img" src="" alt="Infographic" class="max-h-[75vh] object-contain rounded-xl shadow-inner border border-slate-200" onerror="handleImageError(this)">
                <div id="image-error-msg" class="hidden flex-col items-center text-slate-400">
                    <i data-lucide="image-off" size="48" class="mb-2"></i>
                    <p>이미지를 불러올 수 없습니다.</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t py-8 mt-12">
        <div class="max-w-4xl mx-auto px-4 text-center text-slate-400 text-sm font-medium">
            <p>© 2024 Study Dashboard - High School English 1</p>
        </div>
    </footer>

    <script>
        // --- State ---
        let currentLesson = 1;

        // --- Data ---
        const lessonsData = {
            1: {
                title: "Don't Let Anger Be Your Boss",
                vocabulary: [
                    { en: "Adolescence", kr: "청소년기", def: "Stage between childhood and adulthood." },
                    { en: "Aggressive", kr: "공격적인", def: "Ready to attack or confront." },
                    { en: "Coping Skills", kr: "대처 기술", def: "Strategies to manage stress." },
                    { en: "Hormone", kr: "호르몬", def: "Chemicals affecting mood and body." },
                    { en: "Independence", kr: "독립", def: "Free from outside control." },
                    { en: "Productive", kr: "생산적인", def: "Achieving a useful result." }
                ],
                grammar: [
                    { title: "find oneself + v-ing", example: "\"Do you ever find yourself suddenly feeling angry?\"", desc: "자신도 모르게 어떤 상태에 있음을 발견할 때 사용합니다." },
                    { title: "so that + Clause", example: "\"...manage your anger so that it does not turn into aggressive behavior.\"", desc: "~할 수 있도록 목적을 나타냅니다." }
                ],
                content: [
                    { msg: "\"Anger is a feeling, but behavior is a choice.\"", detail: "감정은 자연스럽지만, 행동은 우리의 선택입니다." },
                    { msg: "The Root of Anger", detail: "뇌의 발달 과정과 호르몬이 감정 변화에 영향을 줍니다." }
                ],
                infographic: "unnamed.jpg" // 업로드된 파일명이 .jpg임에 유의
            },
            2: { title: "Lesson 2: Coming Soon", vocabulary: [], grammar: [], content: [] },
            3: { title: "Lesson 3: Coming Soon", vocabulary: [], grammar: [], content: [] },
            4: { title: "Lesson 4: Coming Soon", vocabulary: [], grammar: [], content: [] },
            5: { title: "Lesson 5: Coming Soon", vocabulary: [], grammar: [], content: [] },
            6: { title: "Lesson 6: Coming Soon", vocabulary: [], grammar: [], content: [] },
            7: { title: "Lesson 7: Coming Soon", vocabulary: [], grammar: [], content: [] },
            8: { title: "Lesson 8: Coming Soon", vocabulary: [], grammar: [], content: [] }
        };

        // --- Core Functions ---

        function renderDashboard() {
            const grid = document.getElementById('lesson-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const data = lessonsData[i];
                const isReady = data.vocabulary.length > 0;
                
                const card = document.createElement('div');
                card.onclick = () => selectLesson(i);
                card.className = `lesson-card cursor-pointer bg-white p-6 rounded-2xl border-2 shadow-sm group ${isReady ? 'border-indigo-100' : 'border-slate-100 opacity-60'}`;
                card.innerHTML = `
                    <div class="w-10 h-10 ${isReady ? 'bg-indigo-100 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white' : 'bg-slate-200 text-slate-400'} rounded-lg flex items-center justify-center mb-4 transition-colors">
                        <span class="font-bold text-lg">${i}</span>
                    </div>
                    <h3 class="font-bold ${isReady ? 'text-slate-800' : 'text-slate-400'} mb-1">Lesson ${i}</h3>
                    <p class="text-xs ${isReady ? 'text-slate-500' : 'text-slate-300'} leading-tight italic mb-2">${data.title}</p>
                    <span class="text-[10px] px-2 py-0.5 ${isReady ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-400'} rounded-full font-bold uppercase w-fit">${isReady ? 'Ready' : 'Locked'}</span>
                `;
                grid.appendChild(card);
            }
        }

        function selectLesson(num) {
            currentLesson = num;
            renderLessonContent();
            switchTab('vocabulary');
        }

        function renderLessonContent() {
            const data = lessonsData[currentLesson];
            
            document.getElementById('voca-title').innerText = `L${currentLesson}: Vocabulary`;
            document.getElementById('grammar-title').innerText = `L${currentLesson}: Grammar Points`;
            document.getElementById('content-title').innerText = `L${currentLesson}: Core Summary`;

            const vGrid = document.getElementById('vocabulary-grid');
            vGrid.innerHTML = '';
            if (data.vocabulary.length === 0) {
                vGrid.innerHTML = '<p class="text-slate-400 col-span-full italic">이 레슨의 어휘 데이터는 아직 준비되지 않았습니다.</p>';
            } else {
                data.vocabulary.forEach(word => {
                    const card = document.createElement('div');
                    card.className = "word-card bg-white p-6 rounded-2xl border shadow-sm cursor-pointer hover:shadow-md transition-all";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-indigo-700 text-lg">${word.en}</span>
                            <i data-lucide="help-circle" class="w-4 h-4 text-slate-300"></i>
                        </div>
                        <div class="word-korean font-bold text-rose-500 mb-2">${word.kr}</div>
                        <div class="text-xs text-slate-400 leading-tight">${word.def}</div>
                    `;
                    vGrid.appendChild(card);
                });
            }

            const gList = document.getElementById('grammar-list');
            gList.innerHTML = '';
            if (data.grammar.length === 0) {
                gList.innerHTML = '<p class="text-slate-400 italic">이 레슨의 문법 데이터는 아직 준비되지 않았습니다.</p>';
            } else {
                data.grammar.forEach((point, idx) => {
                    const div = document.createElement('div');
                    div.className = "bg-white border rounded-2xl p-6 shadow-sm";
                    div.innerHTML = `
                        <div class="flex items-center gap-2 mb-4">
                            <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded">Point ${idx+1}</span>
                            <h3 class="font-bold text-xl">${point.title}</h3>
                        </div>
                        <p class="text-slate-700 mb-4 leading-relaxed italic">${point.example}</p>
                        <p class="text-slate-500 text-sm">${point.desc}</p>
                    `;
                    gList.appendChild(div);
                });
            }

            const cList = document.getElementById('content-list');
            cList.innerHTML = '';
            if (data.content.length === 0) {
                cList.innerHTML = '<p class="text-slate-400 italic">이 레슨의 본문 데이터는 아직 준비되지 않았습니다.</p>';
            } else {
                data.content.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "bg-white border p-5 rounded-2xl shadow-sm flex gap-4";
                    div.innerHTML = `
                        <div class="w-8 h-8 bg-rose-500 text-white rounded-full flex-shrink-0 flex items-center justify-center font-bold">!</div>
                        <div>
                            <h4 class="font-bold text-rose-600 mb-1">Key Message</h4>
                            <p class="text-slate-700 text-sm">${item.msg}</p>
                            <p class="text-slate-500 text-xs mt-1">${item.detail}</p>
                        </div>
                    `;
                    cList.appendChild(div);
                });
            }

            const btn = document.getElementById('infographic-btn');
            if (data.infographic) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            } else {
                btn.classList.add('hidden');
                btn.classList.remove('flex');
            }

            lucide.createIcons();
        }

        // --- Navigation Logic ---

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('section-' + tabId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });

            const lessonTabs = document.getElementById('lesson-tabs');
            if (tabId === 'home') {
                lessonTabs.classList.add('hidden');
                document.getElementById('nav-home').classList.remove('text-slate-600', 'hover:bg-slate-100');
                document.getElementById('nav-home').classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            } else {
                lessonTabs.classList.remove('hidden');
                document.getElementById('nav-' + tabId).classList.remove('text-slate-600', 'hover:bg-slate-100');
                document.getElementById('nav-' + tabId).classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Modal ---

        function openModal() {
            const data = lessonsData[currentLesson];
            if (!data.infographic) return;

            const modal = document.getElementById('infographic-modal');
            const modalImg = document.getElementById('modal-img');
            const errorMsg = document.getElementById('image-error-msg');
            
            document.getElementById('modal-title').innerText = `Infographic: Lesson ${currentLesson}`;
            
            // 초기화
            modalImg.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            modalImg.src = data.infographic;
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('infographic-modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            document.body.style.overflow = 'auto';
        }

        function handleImageError(img) {
            img.classList.add('hidden');
            document.getElementById('image-error-msg').classList.remove('hidden');
            console.error("Image load failed:", img.src);
        }

        // --- Init ---

        window.onload = () => {
            renderDashboard();
            lucide.createIcons();
        };
    </script>
</body>
</html>
